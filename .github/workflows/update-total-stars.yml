name: Update Total Stars Count

on:
  schedule:
    - cron: '0 * * * *' # 每小时运行一次
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stars:
    runs-on: ubuntu-latest
    steps:
      # 第 1 步: 检出 main 分支
      - name: Check out main branch
        uses: actions/checkout@v4

      # 第 2 步: 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 第 3 步: 安装 Python 依赖
      - name: Install dependencies
        run: pip install requests

      # 第 4 步: 运行 Python 脚本
      - name: Run Python script to calculate stars
        env:
          ACCOUNTS_TO_CHECK: "kailinjiang,MMKE-Bench-ICLR,EVOKE-LMM,MINED-LMM,MLLMKCBENCH,Rubric4Setwise,KORE-LMM,bigai-ai/ICE,AaronLiu0702/MAPD,baochenfu/OCT-Bench"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/calculate_stars.py
        # 脚本会在根目录(.)生成 total-stars.json

      # 🔴 关键修复 1: 
      # 在 commit 之前，强制在本地创建/切换到这个分支。
      # 这可以防止 "invalid reference" 错误。
      - name: Create or switch to data branch locally
        run: git checkout -B google-scholar-stats

      # 第 5 步: 提交并推送到 google-scholar-stats 分支
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          # 要提交的文件
          file_pattern: 'total-stars.json'
          
          # 提交信息
          commit_message: 'docs: update total stars count'
          
          # 目标分支 (上一步已经创建好了)
          branch: google-scholar-stats
          
          # 🔴 关键修复 2: 
          # 强制推送。因为这个分支只存数据，我们每次都从 main 创建它，
          # 所以必须强制覆盖远程分支，防止 "non-fast-forward" 冲突。
          push_options: '--force'
          
          # 提交者信息
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
