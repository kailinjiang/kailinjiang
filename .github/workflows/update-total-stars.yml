name: Update Total Stars Count

on:
  schedule:
    - cron: '0 * * * *' # 每小时运行一次
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stars:
    runs-on: ubuntu-latest
    steps:
      # 第 1 步: 检出 main 分支
      - name: Check out main branch
        uses: actions/checkout@v4

      # 第 2 步: 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 第 3 步: 安装 Python 依赖
      - name: Install dependencies
        run: pip install requests

      # 第 4 步: 运行 Python 脚本
      #
      # 名单里两种写法含义不同:
      #   裸账号名        —— 统计该账号名下所有仓库, 专用组织用这个, 以后往组织里
      #                      新加仓库不用改这里
      #   owner/repo 形式 —— 只统计这一个仓库。挂在合作者个人账号下的项目必须用
      #                      这种写法, 否则会把对方名下无关仓库的 star 全算进来
      - name: Run Python script to calculate stars
        env:
          ACCOUNTS_TO_CHECK: "kailinjiang,MMKE-Bench-ICLR,EVOKE-LMM,MINED-LMM,MLLMKCBENCH,Rubric4Setwise,KORE-LMM,bigai-ai/ICE,AaronLiu0702/MAPD,baochenfu/OCT-Bench"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/calculate_stars.py
        # 脚本会在根目录(.)生成 total-stars.json

      # 第 5 步: 把 total-stars.json 单独发布到数据分支
      #
      # 用孤儿提交, 而不是从 main 建分支再强推。
      # 原因: 从 main 建分支会把 .github/workflows/ 一起带上去, 那样每次改完
      # workflow 之后的强推, 在 GitHub 看来就是"在数据分支上修改 workflow 文件",
      # 而 GITHUB_TOKEN 没有 workflows 权限, 会被直接 reject。
      # 孤儿提交的树里只有 total-stars.json 一个文件, 压根不涉及 workflow。
      - name: Publish total-stars.json to data branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout --orphan stars-tmp
          git rm -rf --cached . > /dev/null   # 只清索引, 工作区文件不动
          git add -f total-stars.json
          git commit -m "docs: update total stars count"
          git push --force origin stars-tmp:google-scholar-stats
